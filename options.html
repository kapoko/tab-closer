<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Closer Options</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <h1>Tab Closer</h1>
      <form id="options-form" class="card">
        <label class="field">
          <span>Close tabs after</span>
          <input id="timeout-hours" type="number" min="0.1" step="0.1" required>
          <small>Hours since the tab was last activated by you. Default: 12.</small>
        </label>

        <button type="submit">Save</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
